services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: dreamdaccor-backend
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health

    envVars:
      # ── Server ──────────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

      # ── Database ─────────────────────────────────────────────────────────────
      - key: MONGO_URL
        value: mongodb+srv://chand55k_db_user:CHAND@cluster232.wnjpy8y.mongodb.net/dreamdaccor?retryWrites=true&w=majority&appName=Cluster232

      # ── JWT ──────────────────────────────────────────────────────────────────
      - key: JWT_SECRET
        value: 8ce4286bc8a4f05dffb5cc693ed16100fdfec841a50865daf38d1928c8a34ee27b02fb19e485782ea46847fa8f7de84138a276f8918775a88a24b0c66f942e00
      - key: JWT_EXPIRES_IN
        value: 7d

      # ── Google OAuth ─────────────────────────────────────────────────────────
      - key: GOOGLE_CLIENT_ID
        value: 272588106203-rdii3ev0mcgomcuqehr6s8fs519qtgsf.apps.googleusercontent.com

      # ── CORS — frontend URLs ─────────────────────────────────────────────────
      - key: FRONTEND_URL
        value: https://dream-1-w30n.onrender.com,https://dream-two-jet.vercel.app

      # ── Razorpay LIVE Keys ────────────────────────────────────────────────────────
      - key: RAZORPAY_KEY_ID
        value: rzp_live_T97vtgY1z370Nx
      - key: RAZORPAY_KEY_SECRET
        value: l6Jtp6bRRvTJdS5SEA0kvz48

      # ── Email / Resend ────────────────────────────────────────────────────────
      - key: RESEND_API_KEY
        value: re_gjj8ENJn_DMCN1SxBATze2zNZe7Pie5R6
      - key: FROM_EMAIL
        value: onboarding@resend.dev
      - key: ADMIN_EMAIL
        value: gopichand55k@gmail.com

  # ── Frontend Static Site ─────────────────────────────────────────────────────
  - type: web
    name: dreamdaccor-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    # SPA rewrite: all routes → index.html so React Router works in production
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: Cache-Control
        value: no-store

    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_RAZORPAY_KEY_ID
        sync: false
