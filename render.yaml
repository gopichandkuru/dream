services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: dreamdaccor-backend
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health

    envVars:
      # ── Server ──────────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

      # ── Razorpay LIVE Keys (set in Render dashboard as secrets) ─────────────
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

      # ── Email / Resend ───────────────────────────────────────────────────────
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: onboarding@resend.dev
      - key: ADMIN_EMAIL
        value: gopichand55k@gmail.com

      # ── CORS: your frontend URL ──────────────────────────────────────────────
      - key: FRONTEND_URL
        sync: false

  # ── Frontend Static Site ─────────────────────────────────────────────────────
  - type: web
    name: dreamdaccor-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    # SPA rewrite: all routes → index.html so React Router works in production
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: Cache-Control
        value: no-store

    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_RAZORPAY_KEY_ID
        sync: false
